name: dua_app
description: A simple Flutter dua app with splash, index, details, actions, and ad slots.
publish_to: "none"
version: 1.0.4+16

environment:
  sdk: ">=3.10.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  audioplayers: ^6.7.1
  google_mobile_ads: ^9.0.0
  flutter_local_notifications: ^22.2.0
  timezone: ^0.11.1
  shared_preferences: ^2.5.5
  flutter_timezone: ^5.1.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.14.4

flutter:
  uses-material-design: true

  assets:
    - assets/
    - assets/audio/
    - assets/icon/icon.png

flutter_launcher_icons:
  android: "ic_launcher"
  ios: false
  image_path: "assets/icon/icon.png"
  min_sdk_android: 21
  web:
    generate: true
    image_path: "assets/icon/icon.png"
    background_color: "#1F7A5A"
    theme_color: "#1F7A5A"
  macos:
    generate: true
    image_path: "assets/icon/icon.png"
